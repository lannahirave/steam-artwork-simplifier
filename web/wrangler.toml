name = "steam-artwork-studio"
main = "cloudflare/worker.ts"
compatibility_date = "2026-03-02"

# Production URL. Wrangler creates the DNS record and certificate for the custom domain
# (the lannahirave.com zone is in the same Cloudflare account).
routes = [{ pattern = "artworkstudio.lannahirave.com", custom_domain = true }]
# Serve only the custom domain, not a duplicate *.workers.dev copy of the site.
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Aggregate conversion counters for /api/track and /api/stats.
# Schema lives in ./migrations; apply with `npx wrangler d1 migrations apply steam-artwork-stats`.
[[d1_databases]]
binding = "DB"
database_name = "steam-artwork-stats"
database_id = "5cd9e01d-dbda-416b-85b0-6960ba9c3355"
migrations_dir = "migrations"

# Per-visitor burst limit for /api/track, keyed on the client IP (not stored).
# Counters are per Cloudflare location; period must be 10 or 60 seconds.
[[ratelimits]]
name = "TRACK_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[vars]
# The SteamCanvas profile preview: the only origin allowed to embed /bridge/ (see src/bridge/main.ts).
# Must match VITE_PROFILE_PREVIEW_ORIGIN at build time.
PROFILE_PREVIEW_ORIGIN = "https://preview.lannahirave.com"
# Comma-separated origins allowed to POST /api/track. Override locally in .dev.vars.
ALLOWED_ORIGINS = "https://artworkstudio.lannahirave.com"
# Counted beacons per visitor (daily-salted IP hash) per UTC day.
STATS_VISITOR_DAILY_LIMIT = "300"
# Backstop for floods across many IPs: keeps worst-case writes under the D1 free plan's 100k rows/day.
STATS_DAILY_LIMIT = "20000"
# STATS_TOKEN is a secret: `npx wrangler secret put STATS_TOKEN`.
